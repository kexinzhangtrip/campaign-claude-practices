<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Requirement Pool</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Premium palette — brand-aligned, more chromatic & refined
   Primary       #1e40af  deep sapphire (replaces flat blue)
   Accent        #3b5bdb  medium indigo
   Page bg       #f0f2f9  cool lavender-tinted
   Surface       #ffffff
   Border        #dde3f0  blue-tinted
   Heading       #0d1733  deep navy
   Body          #3c4a6e  blue slate
   Muted         #7a87aa  soft periwinkle
   Chart 1       #4f7df3  cornflower
   Chart 2       #9f7aea  soft violet
   Chart 3       #f0a330  amber
   Chart 4       #3dbf82  seafoam
   Chart 5       #e8637a  rose
   Chart 6       #8f96a8  slate
───────────────────────────────────────────────────────────────────────── */
:root{
  --bg:       #eef0f8;
  --w:        #ffffff;
  --b:        #dde3f0;
  --b2:       #c8d1e8;
  --h:        #0d1733;
  --t:        #3c4a6e;
  --m:        #7a87aa;
  --accent:   #3b5bdb;
  --accent-lt:#eef1fd;
  --accent-md:#b9c4f7;
  --c1:       #4f7df3;
  --c2:       #9f7aea;
  --c3:       #f0a330;
  --c4:       #3dbf82;
  --c5:       #e8637a;
  --c6:       #8f96a8;
  --shadow:   0 1px 4px rgba(30,40,80,.07), 0 0 1px rgba(30,40,80,.08);
  --shadow2:  0 4px 16px rgba(30,40,80,.1), 0 0 1px rgba(30,40,80,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--h);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ── HEADER ─────────────────────────────────────────────────────────── */
header{
  background:linear-gradient(135deg,#0d1733 0%,#1e3a8a 100%);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(13,23,51,.25)
}
.logo{font-size:17px;font-weight:800;letter-spacing:-.4px;color:#fff}
.logo em{font-style:normal;color:#93b4fb}
.hd-right{display:flex;align-items:center;gap:12px}
.hd-meta{font-size:12px;color:rgba(255,255,255,.5)}
.pill{display:inline-block;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;backdrop-filter:blur(4px)}
/* Language toggle */
.lang-btn{
  display:flex;align-items:center;gap:0;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  border-radius:20px;overflow:hidden;cursor:pointer
}
.lang-opt{padding:4px 12px;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);transition:all .15s;user-select:none}
.lang-opt.active{background:rgba(255,255,255,.25);color:#fff}
.lang-opt:hover:not(.active){color:rgba(255,255,255,.85)}

/* ── MAIN ───────────────────────────────────────────────────────────── */
main{max-width:1680px;margin:0 auto;padding:22px 26px}

/* ── STAT CARDS ─────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.sc{
  background:var(--w);border-radius:10px;
  padding:15px 17px;border-left:3px solid var(--accent);
  box-shadow:var(--shadow);transition:box-shadow .15s,transform .15s
}
.sc:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.sc-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--m);margin-bottom:4px}
.sc-val{font-size:27px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.sc-sub{font-size:11px;color:var(--m);margin-top:1px}

/* ── FILTER PANEL ───────────────────────────────────────────────────── */
.fp{background:var(--w);border:1px solid var(--b);border-radius:10px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow)}
.fp-head{
  display:flex;align-items:center;padding:9px 16px;gap:8px;
  cursor:pointer;user-select:none;border-bottom:1px solid transparent;transition:border-color .12s
}
.fp-head:hover{background:#f7f9ff}
.fp-head.open{border-bottom-color:var(--b)}
.fp-head-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.55px;color:var(--m)}
.fp-arrow{font-size:9px;color:var(--m);margin-left:auto;transition:transform .2s}
.fp-head.open .fp-arrow{transform:rotate(180deg)}
.fp-body{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:6px}

/* Chips */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 12px;border-radius:99px;font-size:12px;font-weight:500;
  cursor:pointer;border:1px solid var(--b);background:#fff;color:var(--t);
  transition:border-color .12s,background .12s,color .12s,box-shadow .12s;
  user-select:none;white-space:nowrap;line-height:1.3
}
.chip:hover{border-color:var(--accent-md);color:var(--accent);background:var(--accent-lt)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(59,91,219,.3)}
.chip-n{font-size:10px;opacity:.65;font-weight:400}
.chip.on .chip-n{opacity:.8}

/* ── SEARCH BAR ─────────────────────────────────────────────────────── */
.sbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.sbar input{
  flex:1;background:var(--w);border:1px solid var(--b);color:var(--h);
  border-radius:8px;padding:8px 15px;font-size:14px;outline:none;
  box-shadow:var(--shadow);transition:border-color .12s,box-shadow .12s
}
.sbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.1),var(--shadow)}
.sbar input::placeholder{color:var(--m)}
.btn-reset{
  background:var(--w);border:1px solid var(--b);color:var(--t);
  padding:8px 15px;border-radius:8px;cursor:pointer;font-size:13px;
  box-shadow:var(--shadow);transition:all .12s;white-space:nowrap
}
.btn-reset:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-lt)}
.rcount{font-size:12px;color:var(--m);white-space:nowrap}

/* ── TABLE ──────────────────────────────────────────────────────────── */
.tw{background:var(--w);border:1px solid var(--b);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.ts{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:linear-gradient(to bottom,#f4f6fc,#eef1f9)}
th{
  padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--m);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--b);white-space:nowrap
}
td{padding:10px 14px;border-bottom:1px solid var(--b);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:#f7f9ff}
tbody tr.open{background:#f4f6fd}

/* ── BADGES ─────────────────────────────────────────────────────────── */
/* Pill-style, semi-transparent — more premium */
.bdg{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:600;padding:2px 9px;
  border-radius:99px;white-space:nowrap;line-height:1.5
}
/* Status — refined muted tones */
.s-raised  {background:#edfdf4;color:#16864f}
.s-fixed   {background:#eff3ff;color:#2855c9}
.s-under   {background:#e8f5ff;color:#0570b0}
.s-indesign{background:#f3f0ff;color:#6740d0}
.s-completed{background:#edfdf4;color:#126a3e}
.s-onhold  {background:#fff4ed;color:#b85c1a}
.s-discussed{background:#fefbe8;color:#9a7002}
.s-accepting{background:#e8faf5;color:#0a8063}
/* Priority */
.p-p0{background:#fef1f3;color:#c0213a}
.p-p1{background:#fff8e6;color:#9a6200}
.p-p2{background:#edfdf4;color:#16864f}
/* Market */
.m-AU{background:#eff3ff;color:#2855c9}
.m-TH{background:#fff8e6;color:#9a6200}
.m-SG{background:#e8faf5;color:#0a8063}
.m-EU{background:#edfdf4;color:#126a3e}
.m-HQ{background:#f3f0ff;color:#6740d0}
.m-HK{background:#fef1f3;color:#c0213a}
.m-MY{background:#edf7ee;color:#1a6b26}
.m-KR{background:#f9f0ff;color:#7122b8}
.m-multi{background:#f3f0ff;color:#6740d0}

/* ── ROW CONTENT ────────────────────────────────────────────────────── */
.rt{font-weight:600;color:var(--h);line-height:1.45;max-width:420px;letter-spacing:-.01em}
.rt.clamp{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rmeta{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
/* Thumbnail strip */
.thumb-strip{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.thumb{
  width:56px;height:42px;object-fit:cover;
  border-radius:5px;border:1px solid var(--b);
  cursor:zoom-in;transition:transform .15s,box-shadow .15s
}
.thumb:hover{transform:scale(1.1);box-shadow:var(--shadow2);z-index:10;position:relative}
.note-dot{
  width:6px;height:6px;border-radius:50%;background:var(--c3);
  display:inline-block;vertical-align:middle;flex-shrink:0;margin-left:2px
}
.shared-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:#6740d0;
  background:#f3f0ff;border-radius:99px;padding:1px 8px
}

/* ── EXPAND ROW ─────────────────────────────────────────────────────── */
.exp-row td{padding:0!important;border:none!important}

/* ── SIMILAR REQUESTS ───────────────────────────────────────────────────── */
.similar-tag{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:600;color:#0a7063;
  background:#e0f7f4;border-radius:99px;padding:1px 8px
}
.similar-ref-list{margin-top:4px}
.similar-ref{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 8px;border-radius:6px;cursor:pointer;
  transition:background .12s;border:1px solid transparent;margin-bottom:4px
}
.similar-ref:hover{background:#f0f5ff;border-color:var(--b)}
.similar-ref:last-child{margin-bottom:0}
.similar-ref-num{
  flex-shrink:0;font-size:11px;font-weight:700;color:#fff;
  background:var(--accent);border-radius:5px;padding:2px 7px;
  min-width:30px;text-align:center;line-height:1.4
}
.similar-ref-body{flex:1;min-width:0}
.similar-ref-title{font-size:12px;font-weight:600;color:var(--h);line-height:1.4}
.similar-ref-notes{font-size:11px;color:var(--m);margin-top:2px;line-height:1.4}
.similar-filter-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;
  cursor:pointer;border:1px solid var(--b);background:#fff;color:var(--t);
  transition:border-color .12s,background .12s,color .12s;user-select:none
}
.similar-filter-btn:hover{border-color:#0a7063;color:#0a7063;background:#e0f7f4}
.similar-filter-btn.on{background:#0a7063;color:#fff;border-color:#0a7063;font-weight:700}

.exp-body{
  background:linear-gradient(to bottom,#f4f6fd,#eef1f9);
  border-top:1px solid var(--b);
  padding:20px 26px;
  display:grid;grid-template-columns:1fr 1fr;gap:22px
}
@media(max-width:860px){.exp-body{grid-template-columns:1fr}}
.exp-block label{
  display:block;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.6px;color:var(--m);margin-bottom:6px
}
.exp-block p{font-size:13px;color:var(--t);line-height:1.65}
.exp-link{color:var(--accent);text-decoration:none;font-size:12px;font-weight:600}
.exp-link:hover{text-decoration:underline}
/* Full images */
.img-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-gallery img{
  max-height:200px;max-width:340px;border-radius:7px;
  border:1px solid var(--b);cursor:zoom-in;object-fit:contain;
  box-shadow:var(--shadow)
}
/* Notes textarea */
.notes-ta{
  width:100%;min-height:76px;padding:9px 11px;font-size:13px;
  font-family:inherit;border:1px solid var(--b);border-radius:7px;
  color:var(--h);background:#fff;resize:vertical;outline:none;
  transition:border-color .12s,box-shadow .12s
}
.notes-ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,91,219,.08)}
.notes-ta::placeholder{color:var(--m)}
.notes-saved{font-size:11px;color:var(--c4);margin-top:4px;min-height:15px;font-weight:500}

/* ── LIGHTBOX ───────────────────────────────────────────────────────── */
#lightbox{
  display:none;position:fixed;inset:0;
  background:rgba(10,15,35,.82);backdrop-filter:blur(6px);
  z-index:1000;align-items:center;justify-content:center;cursor:zoom-out
}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.5)}

/* ── EMPTY ──────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:60px;color:var(--m)}

/* ── UTILS ──────────────────────────────────────────────────────────── */
.nn{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<div id="lightbox" onclick="closeLightbox()"><img id="lb-img" src="" alt=""></div>

<div style="display:flex;flex-direction:column;min-height:100vh">
<header>
  <div style="display:flex;align-items:center">
    <div class="logo">Campaign <em>Req Pool</em></div>
    <span class="pill nn" id="pill-total">144</span>
  </div>
  <div class="hd-right">
    <div class="hd-meta" id="sync-label"></div>
    <div class="lang-btn" id="lang-btn">
      <span class="lang-opt" data-lang="zh" onclick="setLang('zh')">中文</span>
      <span class="lang-opt active" data-lang="en" onclick="setLang('en')">EN</span>
    </div>
  </div>
</header>

<main>
  <div class="stats" id="stats-cards"></div>
  <div id="filter-panels"></div>
  <div class="sbar">
    <input id="q" type="text">
    <span class="similar-filter-btn" id="similar-toggle" onclick="hasSimilarOnly=!hasSimilarOnly;updateSimilarBtn();renderTable()"></span>
    <button class="btn-reset" onclick="resetAll()" id="btn-reset"></button>
    <span class="rcount" id="rcount"></span>
  </div>
  <div class="tw">
    <div class="ts">
      <table>
        <thead><tr id="thead-row"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty-state" style="display:none"></div>
  </div>
</main>
</div>

const CHART_COLORS = ['#3b5bdb','#9f7aea','#4f7df3','#f0a330','#3dbf82','#e8637a','#8f96a8','#0a8063','#9a6200','#c0213a','#6740d0','#126a3e'];

// ─────────────────────────────────────────────────────────────────────────────
// FILTER DEFINITIONS (fixed keys, labels come from i18n)
// ─────────────────────────────────────────────────────────────────────────────
const FILTER_DEFS = [
  { key:'status',   labelKey:'filterStatus',   field: r => r.status || [] },
  { key:'priority', labelKey:'filterPriority', field: r => r.priority || [] },
  { key:'market',   labelKey:'filterMarket',   field: r => r.market || [] },
  { key:'category', labelKey:'filterCategory', field: r => r.category || [] },
  { key:'product',  labelKey:'filterProduct',  field: r => r.product_line || [] },
  { key:'pic',      labelKey:'filterPic',      field: r => (r.pic||[]).length ? (r.pic||[]).map(p=>p.name||'') : ['(Unassigned)'] },
];

// Global counts (computed once, never change)
const GLOBAL_COUNTS = {};
const FIXED_ORDER   = {};
FILTER_DEFS.forEach(fd => {
  const map = {};
  REQS.forEach(r => fd.field(r).forEach(v => { map[v]=(map[v]||0)+1; }));
  GLOBAL_COUNTS[fd.key] = map;
  FIXED_ORDER[fd.key]   = Object.entries(map).sort((a,b)=>b[1]-a[1]).map(([v])=>v);
});

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const SEL = {};
FILTER_DEFS.forEach(fd => SEL[fd.key] = new Set());
let searchQ = '';
let openId  = null;
let hasSimilarOnly = false;

// ─────────────────────────────────────────────────────────────────────────────
// SHARED DETECTION
// ─────────────────────────────────────────────────────────────────────────────
const painMarkets = {};
REQS.forEach(r => {
  const p = (r.pain_point||'').trim().slice(0,100);
  if(p.length < 20) return;
  if(!painMarkets[p]) painMarkets[p] = new Set();
  (r.market||[]).forEach(m => painMarkets[p].add(m));
});
function isShared(r){
  const p=(r.pain_point||'').trim().slice(0,100);
  return !!(painMarkets[p]&&painMarkets[p].size>1);
}

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function shortName(n){ return (n||'').replace(/\s*\(.*?\)/g,'').trim() }
function fmtDate(d){ return d?d.slice(0,10):'—' }
function extractLink(src){
  if(!src) return null;
  const m=src.match(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/);
  if(m) return {text:m[1],url:m[2]};
  const m2=src.match(/(https?:\/\/\S+)/);
  if(m2) return {text:m2[1].slice(0,55)+'…',url:m2[1]};
  return null;
}
function isImg(a){ const ext=(a.name||'').split('.').pop().toLowerCase(); return ['png','jpg','jpeg','gif','webp'].includes(ext); }
function noteKey(id){ return 'note_'+id }
function getNote(id){ return localStorage.getItem(noteKey(id))||'' }
function saveNote(id,v){ localStorage.setItem(noteKey(id),v) }
function hasNote(id){ const n=localStorage.getItem(noteKey(id)); return !!(n&&n.trim()) }
function dispStatus(s){ return (LANG[lang].statusNames||{})[s] || s }

// Translate "(Unassigned)" key for display
function dispPicVal(v){ return v==='(Unassigned)' ? t('unassigned') : v }

// ─────────────────────────────────────────────────────────────────────────────
// FILTER MATCH
// ─────────────────────────────────────────────────────────────────────────────
function matches(r){
  if(hasSimilarOnly && !(r.similar_refs&&r.similar_refs.length)) return false;
  if(searchQ){
    const h=((r.description||'')+(r.pain_point||'')+(r.source||'')).toLowerCase();
    if(!h.includes(searchQ.toLowerCase())) return false;
  }
  for(const fd of FILTER_DEFS){
    if(!SEL[fd.key].size) continue;
    if(!fd.field(r).some(v=>SEL[fd.key].has(v))) return false;
  }
  return true;
}

function buildStats(){
  const n  = REQS.length;
  const p0 = REQS.filter(r=>(r.priority||[]).includes('P0 - High')).length;
  const ip = REQS.filter(r=>(r.status||[]).some(s=>['Under Development','In Design'].includes(s))).length;
  const dn = REQS.filter(r=>(r.status||[]).some(s=>['Completed','Fixed'].includes(s))).length;
  const pe = REQS.filter(r=>(r.status||[]).includes('Raised / To be evaluated')).length;
  const sh = REQS.filter(r=>isShared(r)).length;
  const sm = REQS.filter(r=>r.similar_refs&&r.similar_refs.length>0).length;
  const cards=[
    {lk:'totalLabel', sk:'totalSub', v:n,  c:'var(--accent)'},
    {lk:'p0Label',    sk:'p0Sub',    v:p0, c:'#c0213a'},
    {lk:'ipLabel',    sk:'ipSub',    v:ip, c:'#0570b0'},
    {lk:'doneLabel',  sk:'doneSub',  v:dn, c:'#126a3e'},
    {lk:'pendLabel',  sk:'pendSub',  v:pe, c:'#9a6200'},
    {lk:'sharedLabel',sk:'sharedSub',v:sh, c:'#6740d0'},
    {lk:'filterSimilarOnly',sk:'similarEmpty',v:sm, c:'#0a7063'},
  ];
  document.getElementById('stats-cards').innerHTML = cards.map(c=>`
    <div class="sc" style="border-left-color:${c.c}">
      <div class="sc-label">${t(c.lk)}</div>
      <div class="sc-val nn" style="color:${c.c}">${c.v}</div>
      <div class="sc-sub">${t(c.sk)}</div>
    </div>`).join('');
}

function buildFilterPanels(){
  const el = document.getElementById('filter-panels');
  el.innerHTML = '';
  FILTER_DEFS.forEach(fd => {
    const panel = document.createElement('div');
    panel.className='fp'; panel.id='fp-'+fd.key;
    const head = document.createElement('div');
    head.className='fp-head open'; head.id='fph-'+fd.key;
    head.innerHTML=`<span class="fp-head-label">${t(fd.labelKey)}</span><span class="fp-arrow">▼</span>`;
    head.onclick=()=>{
      const body=document.getElementById('fpb-'+fd.key);
      const isOpen=body.style.display!=='none';
      body.style.display=isOpen?'none':'';
      head.classList.toggle('open',!isOpen);
    };
    panel.appendChild(head);
    const body=document.createElement('div');
    body.className='fp-body'; body.id='fpb-'+fd.key;
    panel.appendChild(body);
    el.appendChild(panel);
  });
}

function renderChips(){
  FILTER_DEFS.forEach((fd,fi)=>{
    const body=document.getElementById('fpb-'+fd.key);
    if(!body) return;
    const color=CHART_COLORS[fi%CHART_COLORS.length];
    body.innerHTML='';
    FIXED_ORDER[fd.key].forEach(val=>{
      const cnt=GLOBAL_COUNTS[fd.key][val]||0;
      const on=SEL[fd.key].has(val);
      const chip=document.createElement('span');
      chip.className='chip'+(on?' on':'');
      if(on){ chip.style.background=color; chip.style.borderColor=color; }
      const dispVal = fd.key==='pic' ? dispPicVal(val) : (fd.key==='status' ? dispStatus(val) : val);
      chip.innerHTML=`${esc(dispVal)} <span class="chip-n">${cnt}</span>`;
      chip.onclick=()=>toggleSel(fd.key,val);
      body.appendChild(chip);
    });
  });
}
function toggleSel(key,val){
  if(SEL[key].has(val)) SEL[key].delete(val); else SEL[key].add(val);
  renderChips(); renderTable();
}
function resetAll(){
  FILTER_DEFS.forEach(fd=>SEL[fd.key].clear());
  hasSimilarOnly=false; updateSimilarBtn();
  document.getElementById('q').value=''; searchQ='';
  renderChips(); renderTable();
}

    const prios=(r.priority||[]).map(p=>`<span class="bdg ${PRIO_CLS[p]||'p-p1'}">${esc(p)}</span>`).join('');
    const stats=(r.status||[]).map(s=>`<span class="bdg ${STATUS_CLS[s]||'s-raised'}">${esc(dispStatus(s))}</span>`).join('');
    const pics=(r.pic||[]).map(p=>`<span style="font-size:12px;color:var(--t);display:block">${esc(shortName(p.name))}</span>`).join('');

    tr.innerHTML=`
      <td style="color:var(--m);font-size:12px">${idx+1}</td>
      <td>
        <div class="rt clamp">${esc(r.description||'(no title)')}</div>
        <div class="rmeta">${sharedBdg}${simBdg}${noteInd}</div>
        ${thumbHtml}
      </td>
      <td>${mkts}</td>
      <td>${cats}</td>
      <td>${prods}</td>
      <td>${prios}</td>
      <td>${stats}</td>
      <td>${pics}</td>
      <td style="font-size:11px;color:var(--m)">${fmtDate(r.date)}</td>`;
    tr.onclick=()=>toggleExpand(r,tr);
    tbody.appendChild(tr);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// EXPAND (in-place, no full re-render)
// ─────────────────────────────────────────────────────────────────────────────
function buildExpandRow(r){
  const imgs=(r.attachment||[]).filter(a=>a.local_path&&isImg(a));
  const link=extractLink(r.source);
  const fullImgs=imgs.map(a=>`<img src="${esc(a.local_path)}" title="${esc(a.name)}" onclick="openLightbox('${esc(a.local_path)}')">`).join('');
  const noteVal=esc(getNote(r.id));
  const reqName=Array.isArray(r.requester)
    ? r.requester.map(p=>esc(p.name||'')).join(', ')||'—'
    : (r.requester?esc(r.requester.name||''):'—');

  const extr=document.createElement('tr');
  extr.className='exp-row'; extr.id='exp-'+r.id;
  extr.innerHTML=`<td colspan="9">
    <div class="exp-body">
      <div class="exp-block">
        <label>${t('expPainPoint')}</label>
        <p>${esc(r.pain_point||r.description||'—')}</p>
        ${isShared(r)?`<div style="margin-top:8px"><span class="shared-tag">${t('sharedTagDetail')}</span></div>`:''}
      </div>
      <div class="exp-block">
        <label>${t('expSource')}</label>
        ${link?`<a class="exp-link" href="${esc(link.url)}" target="_blank">🔗 ${esc(link.text)}</a>`:`<p style="color:var(--m)">—</p>`}
        ${fullImgs?`<div class="img-gallery">${fullImgs}</div>`:''}
      </div>
      <div class="exp-block">
        <label>${t('expPicReq')}</label>
        <p>${(r.pic||[]).map(p=>esc(p.name||'')).join('<br>')||'—'}</p>
        <p style="margin-top:6px;font-size:12px;color:var(--m)">${t('requesterLabel')}: <span style="color:var(--t);font-weight:500">${reqName}</span></p>
      </div>

      <div class="exp-block" style="grid-column:1/-1">
        <label>${t('expSimilar')}</label>
        ${(r.similar_refs&&r.similar_refs.length)?`
        <div class="similar-ref-list">
          ${(r.similar_refs||[]).map(ref=>`
            <div class="similar-ref" onclick="event.stopPropagation();navigateToReq(${ref.num})" title="${t('similarClick')}">
              <span class="similar-ref-num">#${ref.num}</span>
              <div class="similar-ref-body">
                <div class="similar-ref-title">${esc(ref.title)}</div>
                ${ref.notes?`<div class="similar-ref-notes">${esc(ref.notes)}</div>`:''}
              </div>
            </div>`).join('')}
        </div>
        `:`<p style="color:var(--m);font-size:12px">${t('similarEmpty')}</p>`}
      </div>
      <div class="exp-block">
        <label>${t('expNotes')}</label>
        <textarea class="notes-ta" id="ta-${r.id}" placeholder="${t('notePlaceholder')}" oninput="handleNote('${r.id}',this.value)">${noteVal}</textarea>
        <div class="notes-saved" id="ns-${r.id}"></div>
      </div>
    </div>
  </td>`;
  return extr;
}

function toggleExpand(r,tr){
  const existing=document.getElementById('exp-'+r.id);
  if(existing){
    existing.remove(); tr.classList.remove('open'); openId=null;
  } else {
    if(openId){
      const prev=document.getElementById('exp-'+openId);
      if(prev){ prev.previousElementSibling&&prev.previousElementSibling.classList.remove('open'); prev.remove(); }
    }
    openId=r.id; tr.classList.add('open');
    const extr=buildExpandRow(r);
    tr.after(extr);
    extr.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// NOTES
// ─────────────────────────────────────────────────────────────────────────────
let noteTimer=null;
function handleNote(id,val){
  saveNote(id,val);
  const ns=document.getElementById('ns-'+id);
  if(ns){ clearTimeout(noteTimer); ns.textContent=t('noteSaved'); noteTimer=setTimeout(()=>{ if(ns)ns.textContent=''; },1500); }
}

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────────────────────────────────────
function openLightbox(src){ document.getElementById('lb-img').src=src; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('show'); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeLightbox(); });

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input',e=>{ searchQ=e.target.value.trim(); renderTable(); });


// ─────────────────────────────────────────────────────────────────────────────
// SIMILAR REQUIREMENT NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function navigateToReq(num){
  // num is 1-indexed (matches Lark row order)
  const targetReq = REQS[num-1];
  if(!targetReq) return;
  // If hasSimilarOnly is on and target has no similar, temporarily turn it off
  const wasSimOnly = hasSimilarOnly;
  if(wasSimOnly){ hasSimilarOnly=false; renderTable(); updateSimilarBtn(); }
  // Clear other filters that might hide target
  // Try to find the row element by data attribute
  const allRows = document.querySelectorAll('#tbody tr[data-req-idx]');
  let targetTr = null;
  allRows.forEach(tr=>{ if(parseInt(tr.dataset.reqIdx)===num-1) targetTr=tr; });
  if(!targetTr){
    // Target filtered out — reset all filters
    FILTER_DEFS.forEach(fd=>SEL[fd.key].clear());
    renderChips(); renderTable();
    setTimeout(()=>{
      const allRows2=document.querySelectorAll('#tbody tr[data-req-idx]');
      allRows2.forEach(tr=>{ if(parseInt(tr.dataset.reqIdx)===num-1) targetTr=tr; });
      if(targetTr) openAndScroll(targetTr, targetReq);
    },50);
  } else {
    openAndScroll(targetTr, targetReq);
  }
}

function openAndScroll(tr, r){
  // Close any open expand row
  if(openId!==null){
    const prev=document.getElementById('exp-'+openId);
    if(prev){ prev.previousElementSibling&&prev.previousElementSibling.classList.remove('open'); prev.remove(); }
    openId=null;
  }
  tr.classList.add('open');
  openId=r.id;
  const extr=buildExpandRow(r);
  tr.after(extr);
  tr.scrollIntoView({block:'center',behavior:'smooth'});
  // Flash highlight
  tr.style.transition='background .1s';
  tr.style.background='#dff0ff';
  setTimeout(()=>{ tr.style.background=''; }, 800);
}

function updateSimilarBtn(){
  const btn=document.getElementById('similar-toggle');
  if(btn) btn.classList.toggle('on', hasSimilarOnly);
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER ALL (called on init + lang switch)
// ─────────────────────────────────────────────────────────────────────────────
function renderAll(fromLangSwitch){
  // Update static text
  document.getElementById('sync-label').textContent=t('syncLabel')+' · '+new Date().toLocaleDateString(lang==='zh'?'zh-CN':'en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('q').placeholder=t('searchPlaceholder');
  document.getElementById('btn-reset').textContent=t('btnReset');
  const simBtn=document.getElementById('similar-toggle');
  if(simBtn) simBtn.textContent=t('filterSimilarOnly');
  // Re-render sections
  buildStats();
  if(fromLangSwitch){
    // rebuild filter labels but keep open state
    document.querySelectorAll('.fp-head-label').forEach((el,i)=>{ el.textContent=t(FILTER_DEFS[i].labelKey); });
    renderChips();
  } else {
    buildFilterPanels();
    renderChips();
  }
  renderThead();
  // Re-render expand row with new language if open
  if(openId){
    const prev=document.getElementById('exp-'+openId);
    const prevTr=prev&&prev.previousElementSibling;
    if(prev&&prevTr){
      const r=REQS.find(r=>r.id===openId);
      if(r){ prev.replaceWith(buildExpandRow(r)); }
    }
  }
  renderTable();
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
renderAll(false);
</script>
</body>
</html>
